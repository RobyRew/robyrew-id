# Build definition lives in RobyRew/platform so it is maintained once for the fleet.
name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.vscode/**']
  workflow_dispatch:

jobs:
  build:
    # A called workflow can only reduce the caller's permissions, so packages:
    # write is granted here.
    permissions:
      contents: read
      packages: write
    uses: RobyRew/platform/.github/workflows/build-image.yml@main
    with:
      # No Dokploy app exists yet (docs/deploy.md): build and publish the image
      # only. Remove this once DOKPLOY_DEPLOY_WEBHOOK is set.
      request_deploy: false
    secrets:
      DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
